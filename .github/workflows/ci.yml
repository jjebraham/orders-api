name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: orders_test
          POSTGRES_USER: orders
          POSTGRES_PASSWORD: orders
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orders -d orders_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://orders:orders@localhost:5432/orders_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Run tests against Postgres
        run: pytest -v

      - name: Migrate a fresh database
        env:
          PGPASSWORD: orders
        run: |
          psql -h localhost -U orders -d orders_test -c "DROP DATABASE IF EXISTS migrate_check" -c "CREATE DATABASE migrate_check"
          export DATABASE_URL=postgresql+asyncpg://orders:orders@localhost:5432/migrate_check
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t orders-api:ci .
